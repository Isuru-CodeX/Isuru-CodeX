<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="370" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </linearGradient>

    <linearGradient id="shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>

    <clipPath id="main-bar-clip">
      <rect x="30" y="85" width="740" height="18" rx="9"/>
    </clipPath>

    <style>
      .text-title { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f0f6fc; }
      .text-sub { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8b949e; }
      .text-lang { font: 600 14px 'Fira Code', -apple-system, BlinkMacSystemFont, monospace; fill: #e6edf3; }
      .text-pct { font: 700 14px 'Fira Code', -apple-system, BlinkMacSystemFont, monospace; fill: #58a6ff; }
      .text-bytes { font: 400 12px 'Fira Code', monospace; fill: #7d8590; }

      @keyframes growMain {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @keyframes growSub {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @keyframes shimmerMove {
        0% { transform: translateX(-740px); }
        100% { transform: translateX(740px); }
      }
      @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.35); opacity: 0.5; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animated-main-bar {
        transform-origin: 30px 85px;
        animation: growMain 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animated-bar {
        transform-origin: left;
        animation: growSub 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .shimmer-effect {
        animation: shimmerMove 3s infinite linear;
      }
      .pulsing-dot {
        transform-origin: 755px 44px;
        animation: pulseDot 2s infinite ease-in-out;
      }
      .fade-row {
        animation: fadeIn 0.8s ease-out forwards;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="798" height="368" rx="16" fill="url(#card-bg)"/>
  <rect x="1" y="1" width="798" height="368" rx="16" stroke="url(#border-glow)" stroke-width="1.5" fill="none"/>

  <!-- Header Section -->
  <g transform="translate(30, 48)">
    <circle cx="8" cy="-5" r="7" fill="#7c3aed" opacity="0.3"/>
    <text x="24" y="0" class="text-title">🧬 Codebase Language Distribution</text>
    <text x="350" y="0" class="text-sub">• 4.94 MB analyzed across 5 public repositories</text>
  </g>

  <!-- Live Pulse Status Indicator -->
  <circle cx="755" cy="44" r="5" fill="#10b981" class="pulsing-dot"/>
  <circle cx="755" cy="44" r="8" stroke="#10b981" stroke-width="1.5" opacity="0.4" class="pulsing-dot"/>

  <!-- Master Multi-Segment Bar -->
  <g clip-path="url(#main-bar-clip)" class="animated-main-bar">
    <!-- Python: 30.42% of 740 = 225.1px -->
    <rect x="30" y="85" width="225.1" height="18" fill="#3572A5"/>
    <!-- TypeScript: 29.80% of 740 = 220.5px -->
    <rect x="255.1" y="85" width="220.5" height="18" fill="#3178C6"/>
    <!-- PHP: 14.39% of 740 = 106.5px -->
    <rect x="475.6" y="85" width="106.5" height="18" fill="#4F5D95"/>
    <!-- Java: 10.41% of 740 = 77.0px -->
    <rect x="582.1" y="85" width="77.0" height="18" fill="#ED8B00"/>
    <!-- JavaScript: 5.50% of 740 = 40.7px -->
    <rect x="659.1" y="85" width="40.7" height="18" fill="#F7DF1E"/>
    <!-- CSS: 4.99% of 740 = 36.9px -->
    <rect x="699.8" y="85" width="36.9" height="18" fill="#563D7C"/>
    <!-- HTML: 4.19% of 740 = 31.0px -->
    <rect x="736.7" y="85" width="31.0" height="18" fill="#E34F26"/>
    <!-- Other: 0.30% of 740 = 2.3px -->
    <rect x="767.7" y="85" width="2.3" height="18" fill="#8b949e"/>

    <!-- Shimmer reflection highlight -->
    <rect x="30" y="85" width="740" height="18" fill="url(#shimmer-grad)" class="shimmer-effect"/>
  </g>

  <!-- ================= LEFT COLUMN ================= -->

  <!-- Python -->
  <g transform="translate(30, 130)" class="fade-row">
    <circle cx="8" cy="10" r="6" fill="#3572A5"/>
    <text x="24" y="15" class="text-lang">Python</text>
    <text x="230" y="15" class="text-pct">30.42%</text>
    <text x="300" y="15" class="text-bytes">1.50 MB</text>
    <!-- Background track -->
    <rect x="24" y="24" width="330" height="6" rx="3" fill="#21262d"/>
    <!-- Active animated bar: 330 * 30.42% = 100.4px (scale-adjusted) -->
    <rect x="24" y="24" width="220" height="6" rx="3" fill="#3572A5" class="animated-bar"/>
  </g>

  <!-- TypeScript -->
  <g transform="translate(30, 185)" class="fade-row">
    <circle cx="8" cy="10" r="6" fill="#3178C6"/>
    <text x="24" y="15" class="text-lang">TypeScript</text>
    <text x="230" y="15" class="text-pct">29.80%</text>
    <text x="300" y="15" class="text-bytes">1.47 MB</text>
    <rect x="24" y="24" width="330" height="6" rx="3" fill="#21262d"/>
    <rect x="24" y="24" width="215" height="6" rx="3" fill="#3178C6" class="animated-bar"/>
  </g>

  <!-- PHP -->
  <g transform="translate(30, 240)" class="fade-row">
    <circle cx="8" cy="10" r="6" fill="#4F5D95"/>
    <text x="24" y="15" class="text-lang">PHP</text>
    <text x="230" y="15" class="text-pct">14.39%</text>
    <text x="300" y="15" class="text-bytes">710 KB</text>
    <rect x="24" y="24" width="330" height="6" rx="3" fill="#21262d"/>
    <rect x="24" y="24" width="130" height="6" rx="3" fill="#4F5D95" class="animated-bar"/>
  </g>

  <!-- Java -->
  <g transform="translate(30, 295)" class="fade-row">
    <circle cx="8" cy="10" r="6" fill="#ED8B00"/>
    <text x="24" y="15" class="text-lang">Java</text>
    <text x="230" y="15" class="text-pct">10.41%</text>
    <text x="300" y="15" class="text-bytes">514 KB</text>
    <rect x="24" y="24" width="330" height="6" rx="3" fill="#21262d"/>
    <rect x="24" y="24" width="100" height="6" rx="3" fill="#ED8B00" class="animated-bar"/>
  </g>

  <!-- ================= RIGHT COLUMN ================= -->

  <!-- JavaScript -->
  <g transform="translate(415, 130)" class="fade-row">
    <circle cx="8" cy="10" r="6" fill="#F7DF1E"/>
    <text x="24" y="15" class="text-lang">JavaScript</text>
    <text x="230" y="15" class="text-pct">5.50%</text>
    <text x="300" y="15" class="text-bytes">271 KB</text>
    <rect x="24" y="24" width="330" height="6" rx="3" fill="#21262d"/>
    <rect x="24" y="24" width="65" height="6" rx="3" fill="#F7DF1E" class="animated-bar"/>
  </g>

  <!-- CSS -->
  <g transform="translate(415, 185)" class="fade-row">
    <circle cx="8" cy="10" r="6" fill="#563D7C"/>
    <text x="24" y="15" class="text-lang">CSS</text>
    <text x="230" y="15" class="text-pct">4.99%</text>
    <text x="300" y="15" class="text-bytes">247 KB</text>
    <rect x="24" y="24" width="330" height="6" rx="3" fill="#21262d"/>
    <rect x="24" y="24" width="58" height="6" rx="3" fill="#563D7C" class="animated-bar"/>
  </g>

  <!-- HTML -->
  <g transform="translate(415, 240)" class="fade-row">
    <circle cx="8" cy="10" r="6" fill="#E34F26"/>
    <text x="24" y="15" class="text-lang">HTML</text>
    <text x="230" y="15" class="text-pct">4.19%</text>
    <text x="300" y="15" class="text-bytes">207 KB</text>
    <rect x="24" y="24" width="330" height="6" rx="3" fill="#21262d"/>
    <rect x="24" y="24" width="50" height="6" rx="3" fill="#E34F26" class="animated-bar"/>
  </g>

  <!-- Other (Hack, Shell, Docker) -->
  <g transform="translate(415, 295)" class="fade-row">
    <circle cx="8" cy="10" r="6" fill="#8b949e"/>
    <text x="24" y="15" class="text-lang">Other (Shell, Docker)</text>
    <text x="230" y="15" class="text-pct">0.30%</text>
    <text x="300" y="15" class="text-bytes">14 KB</text>
    <rect x="24" y="24" width="330" height="6" rx="3" fill="#21262d"/>
    <rect x="24" y="24" width="18" height="6" rx="3" fill="#8b949e" class="animated-bar"/>
  </g>

</svg>
