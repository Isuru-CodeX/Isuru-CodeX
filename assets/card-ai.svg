<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<style>
text{font-family:'Fira Code',ui-monospace,Menlo,monospace}
.t{font-size:16px;letter-spacing:1px;font-weight:800}
.glow{animation:g 4s ease-in-out infinite}
@keyframes g{50%{opacity:.55}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151833"/><stop offset=".55" stop-color="#0a0b18"/><stop offset="1" stop-color="#05050b"/></linearGradient>
<radialGradient id="a" cx=".3" cy=".25" r=".7"><stop offset="0" stop-color="#00d4ff" stop-opacity=".45"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
<radialGradient id="b" cx=".85" cy=".9" r=".6"><stop offset="0" stop-color="#ff4fd8" stop-opacity=".5"/><stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".7"/></filter>
<clipPath id="clip"><rect width="240" height="240" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="240" height="240" fill="url(#bg)"/>
<rect width="240" height="240" fill="url(#a)" class="glow"/>
<rect width="240" height="240" fill="url(#b)"/>
<!-- Twinkling stars -->
<circle cx="53" cy="37" r="1.0" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="106" cy="74" r="1.4" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="159" cy="111" r="0.6" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="212" cy="148" r="1.0" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="25" cy="35" r="1.4" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="184" cy="146" r="1.4" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="209" cy="31" r="1.0" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="3s" repeatCount="indefinite"/></circle>
<!-- Top shine & sweeping beam -->
<rect width="240" height="120" fill="url(#shine)"/>
<rect x="-160" y="0" width="120" height="240" fill="url(#sweep)" transform="skewX(-20)"><animate attributeName="x" values="-200;-200;400" keyTimes="0;.7;1" dur="5s" repeatCount="indefinite"/></rect>
<!-- Bottom label background -->
<rect y="172" width="240" height="68" fill="#000" opacity=".4"/>
</g>
<!-- Glowing edge border & racing light tracer -->
<rect x="1" y="1" width="238" height="238" rx="19" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity=".9"/>
<rect x="1" y="1" width="238" height="238" rx="19" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="30 900"><animate attributeName="stroke-dashoffset" from="0" to="-930" dur="5s" repeatCount="indefinite"/></rect>
<!-- Graphic: Neural Network + Live Voice AI Equalizer -->
<g transform="translate(30,22)" filter="url(#neon)">
  <!-- Neural connections -->
  <line x1="20" y1="35" x2="60" y2="20" stroke="#00d4ff" stroke-opacity=".3"/>
  <line x1="20" y1="75" x2="60" y2="55" stroke="#00d4ff" stroke-opacity=".3"/>
  <line x1="20" y1="115" x2="60" y2="90" stroke="#00d4ff" stroke-opacity=".3"/>
  <line x1="160" y1="35" x2="120" y2="20" stroke="#ff4fd8" stroke-opacity=".3"/>
  <line x1="160" y1="75" x2="120" y2="55" stroke="#ff4fd8" stroke-opacity=".3"/>
  <line x1="160" y1="115" x2="120" y2="90" stroke="#ff4fd8" stroke-opacity=".3"/>
  <!-- Neural Nodes -->
  <circle cx="20" cy="35" r="5" fill="#00d4ff"><animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="20" cy="75" r="5" fill="#00d4ff"><animate attributeName="opacity" values=".4;1;.4" dur="2s" begin=".4s" repeatCount="indefinite"/></circle>
  <circle cx="20" cy="115" r="5" fill="#00d4ff"><animate attributeName="opacity" values=".4;1;.4" dur="2s" begin=".8s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="35" r="5" fill="#ff4fd8"><animate attributeName="opacity" values=".4;1;.4" dur="2s" begin=".2s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="75" r="5" fill="#ff4fd8"><animate attributeName="opacity" values=".4;1;.4" dur="2s" begin=".6s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="115" r="5" fill="#ff4fd8"><animate attributeName="opacity" values=".4;1;.4" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
  <!-- Center Equalizer Visualizer Screen -->
  <rect x="45" y="25" width="90" height="95" rx="8" fill="#0b0e1c" stroke="#00d4ff" stroke-width="1.5"/>
  <!-- Equalizer Bouncing Bars (Voice AI Simulator) -->
  <rect x="55" y="65" width="6" height="20" rx="3" fill="#00d4ff"><animate attributeName="height" values="10;36;14;48;10" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="70;57;68;51;70" dur="1.4s" repeatCount="indefinite"/></rect>
  <rect x="67" y="60" width="6" height="30" rx="3" fill="#38bdf8"><animate attributeName="height" values="16;52;22;42;16" dur="1.2s" begin=".2s" repeatCount="indefinite"/><animate attributeName="y" values="67;49;64;54;67" dur="1.2s" begin=".2s" repeatCount="indefinite"/></rect>
  <rect x="79" y="50" width="6" height="45" rx="3" fill="#a78bfa"><animate attributeName="height" values="24;66;30;58;24" dur="1.5s" begin=".1s" repeatCount="indefinite"/><animate attributeName="y" values="63;42;60;46;63" dur="1.5s" begin=".1s" repeatCount="indefinite"/></rect>
  <rect x="91" y="55" width="6" height="38" rx="3" fill="#c084fc"><animate attributeName="height" values="18;60;25;50;18" dur="1.3s" begin=".3s" repeatCount="indefinite"/><animate attributeName="y" values="66;45;62;50;66" dur="1.3s" begin=".3s" repeatCount="indefinite"/></rect>
  <rect x="103" y="62" width="6" height="26" rx="3" fill="#ff4fd8"><animate attributeName="height" values="12;44;18;38;12" dur="1.6s" begin=".4s" repeatCount="indefinite"/><animate attributeName="y" values="69;53;66;56;69" dur="1.6s" begin=".4s" repeatCount="indefinite"/></rect>
  <rect x="115" y="70" width="6" height="15" rx="3" fill="#ff4fd8"><animate attributeName="height" values="8;32;12;28;8" dur="1.1s" begin=".15s" repeatCount="indefinite"/><animate attributeName="y" values="71;59;69;61;71" dur="1.1s" begin=".15s" repeatCount="indefinite"/></rect>
  <!-- Mic & STAR badge text -->
  <text x="90" y="40" text-anchor="middle" fill="#00d4ff" style="font-size:8px;font-weight:700;letter-spacing:1px">🎙️ STAR AI</text>
  <text x="90" y="110" text-anchor="middle" fill="#ff4fd8" style="font-size:7px;letter-spacing:0.5px">VOICE CO-PILOT</text>
</g>
<text x="120" y="210" text-anchor="middle" class="t" fill="url(#edge)" filter="url(#soft)">AI &amp; VOICE</text>
</svg>
