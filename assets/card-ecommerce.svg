<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<style>
text{font-family:'Fira Code',ui-monospace,Menlo,monospace}
.t{font-size:16px;letter-spacing:1px;font-weight:800}
.glow{animation:g 4s ease-in-out infinite}
@keyframes g{50%{opacity:.55}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151833"/><stop offset=".55" stop-color="#0a0b18"/><stop offset="1" stop-color="#05050b"/></linearGradient>
<radialGradient id="a" cx=".3" cy=".25" r=".7"><stop offset="0" stop-color="#ffd166" stop-opacity=".45"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>
<radialGradient id="b" cx=".85" cy=".9" r=".6"><stop offset="0" stop-color="#635bff" stop-opacity=".55"/><stop offset="1" stop-color="#635bff" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#635bff"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".7"/></filter>
<clipPath id="clip"><rect width="240" height="240" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="240" height="240" fill="url(#bg)"/>
<rect width="240" height="240" fill="url(#a)" class="glow"/>
<rect width="240" height="240" fill="url(#b)"/>
<!-- Stars -->
<circle cx="53" cy="37" r="1.0" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="106" cy="74" r="1.4" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="159" cy="111" r="0.6" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="212" cy="148" r="1.0" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="184" cy="146" r="1.4" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="2s" repeatCount="indefinite"/></circle>
<!-- Shine & sweep -->
<rect width="240" height="120" fill="url(#shine)"/>
<rect x="-160" y="0" width="120" height="240" fill="url(#sweep)" transform="skewX(-20)"><animate attributeName="x" values="-200;-200;400" keyTimes="0;.7;1" dur="5s" repeatCount="indefinite"/></rect>
<rect y="172" width="240" height="68" fill="#000" opacity=".4"/>
</g>
<rect x="1" y="1" width="238" height="238" rx="19" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity=".9"/>
<rect x="1" y="1" width="238" height="238" rx="19" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="30 900"><animate attributeName="stroke-dashoffset" from="0" to="-930" dur="5s" repeatCount="indefinite"/></rect>
<!-- Graphic: Credit Card + Stripe Payment + Automated PDF Invoice -->
<g transform="translate(42,20)" filter="url(#neon)">
  <!-- Floating Payment Card -->
  <rect x="10" y="8" width="136" height="82" rx="10" fill="#0b0e1c" stroke="#635bff" stroke-width="2"/>
  <!-- Card Header Strip -->
  <rect x="10" y="24" width="136" height="14" fill="#635bff" fill-opacity=".3"/>
  <!-- EMV Gold Chip -->
  <rect x="22" y="46" width="18" height="14" rx="3" fill="#ffd166"/>
  <!-- Animated Cardholder & Number lines -->
  <rect x="46" y="52" width="55" height="4" rx="2" fill="#fff" opacity=".8"/>
  <rect x="22" y="68" width="40" height="3" rx="1.5" fill="#a78bfa"/>
  <!-- Stripe badge -->
  <rect x="104" y="64" width="32" height="14" rx="4" fill="#635bff"/>
  <text x="120" y="74" text-anchor="middle" fill="#fff" style="font-size:7px;font-weight:700">STRIPE</text>

  <!-- Automated Invoice Sheet Sliding Out -->
  <g transform="translate(25,75)">
    <rect width="105" height="48" rx="6" fill="#0d1117" stroke="#ffd166" stroke-width="1.5"/>
    <text x="10" y="14" fill="#ffd166" style="font-size:8px;font-weight:700">INVOICE.PDF</text>
    <circle cx="95" cy="12" r="4" fill="#28c840"><animate attributeName="opacity" values=".3;1;.3" dur="1.5s" repeatCount="indefinite"/></circle>
    <line x1="10" y1="24" x2="70" y2="24" stroke="#ffd166" stroke-opacity=".5" stroke-width="2"/>
    <line x1="10" y1="34" x2="50" y2="34" stroke="#ffd166" stroke-opacity=".3" stroke-width="2"/>
    <text x="95" y="36" text-anchor="end" fill="#28c840" style="font-size:8px;font-weight:700">PAID ✓</text>
  </g>
</g>
<text x="120" y="210" text-anchor="middle" class="t" fill="url(#edge)" filter="url(#soft)">E-COMMERCE &amp; PAY</text>
</svg>
